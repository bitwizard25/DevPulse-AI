[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devpulse-ai"
version = "0.3.1"
description = "Task-first local coding harness with durable sessions and code review"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
devpulse = "devpulse.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["devpulse*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B023"]

[tool.ruff.format]
quote-style = "single"
